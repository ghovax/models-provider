[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "models-provider"
version = "0.1.2"
description = "An independent models.dev catalogue and interchangeable model provider layer."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giovanni Gravili" }]
keywords = ["ai", "llm", "models", "providers", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.0",
    "langchain-core>=1.0",
    "litellm>=1.60.0",
    "pydantic>=2.0.0",
    "websockets>=15.0,<16",
]

[project.urls]
Repository = "https://github.com/ghovax/models-provider"
Issues = "https://github.com/ghovax/models-provider/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/models_provider"]

[tool.hatch.build]
include = ["src/models_provider/**/*.py", "src/models_provider/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "RUF006", "RUF012", "RUF018", "RUF019"]
